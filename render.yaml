services:
  - type: web
    name: postflow-ai-backend
    env: python
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt && (node --version && npm --version && git clone --depth=1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git bgutil && cd bgutil/server && npm ci && npm run build && echo "[POT] bgutil server built OK" || echo "[POT] bgutil build failed, downloads will run without PO tokens")
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: postflow-ai-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

databases:
  - name: postflow-ai-db
    databaseName: postflow
    user: postflow
    plan: free
